name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs on ws-ws01 (Windows Server 2022) using the pre-provisioned rustup/cargo.
# Installing a toolchain action that shells out to bash fails on this runner
# (service account cannot launch WSL).
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain identity
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cargo check
        shell: pwsh
        run: cargo check --jobs 80

      - name: Cargo clippy
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings
