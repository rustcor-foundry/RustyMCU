name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs on a Windows runner with a pre-provisioned rustup/cargo toolchain.
# Toolchain-installer actions that shell out to bash are not used because
# WSL is unavailable in this environment.
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain identity
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cargo check
        shell: pwsh
        run: cargo check --jobs 80

      - name: Cargo clippy
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings
