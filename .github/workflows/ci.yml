name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Bevy/winit need ALSA, xkbcommon, Wayland and the xcb trio; serialport
      # needs libudev; tray-icon needs GTK3 plus libxdo and an appindicator
      # implementation. Windows ships the equivalents with the toolchain.
      #
      # The appindicator package was renamed to the Ayatana fork on newer
      # Ubuntu, so try that first and fall back to the original name.
      - name: Install Linux build deps (Bevy / winit / serial / tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev libxdo-dev
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            || sudo apt-get install -y --no-install-recommends libappindicator3-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --all-targets

      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check
